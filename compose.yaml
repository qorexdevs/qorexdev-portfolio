name: qorexdev-portfolio

services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_PATH: /app/data/demo.sqlite
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      TRUST_PROXY: '1'
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_POLLING: ${TELEGRAM_BOT_POLLING:-0}
      BOT_PROXY_URL: ${BOT_PROXY_URL:-socks5h://host.docker.internal:9050}
      MAX_WORKSPACES: ${MAX_WORKSPACES:-200}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      NEW_WORKSPACE_LIMIT: ${NEW_WORKSPACE_LIMIT:-20}
    volumes:
      - demo_data:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    expose:
      - '3000'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 100
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      WWW_DOMAIN: ${WWW_DOMAIN:?Set WWW_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  demo_data:
  caddy_data:
  caddy_config:
